services:
  - type: web
    name: signalementurbain
    runtime: docker
    branch: codex
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "Signalement Urbain"
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://signalementurbain.onrender.com
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
